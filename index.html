<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELUM Type</title>
    <meta name="description" content="Messages and email in one calm inbox. Built by people. Runs without AI." />
    <link rel="icon" href="/brand/type/elum-type-app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-512.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1220" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong one.
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('elum.theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
