# Netlify: build the app and serve it as a single-page app.
# Set VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY in the site's environment variables.
[build]
  command = "node scripts/require-supabase.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Every path (/t/<id>, /signin, ...) loads the app, which does its own routing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Only ELUM Browse and ELUM's own sites may show this app inside a frame (Browse opens ELUM apps
# in its tabs); every other site is refused, which keeps clickjacking out.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://browsebyelum.netlify.app https://elumbrowse.netlify.app https://elum.services https://*.elum.services"
